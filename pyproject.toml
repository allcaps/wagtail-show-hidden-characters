[project]
name = "wagtail-show-hidden-characters"
version = "0.1.0"
description = ""
keywords = ["wagtail", "draftail", "invisible", "characters"]
license = "BSD-3-Clause"
readme = "README.md"
authors = [
    { name = "Coen van der Kamp", email = "coen@fourdigits.nl" }
]
requires-python = ">=3.10"
dependencies = [
  "wagtail",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Wagtail",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
test = [
  "djlint",
  "Pillow",
  "pytest",
  "pytest-django",
  "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_project.settings"
addopts = [
  "-ra",
]
pythonpath = [
  "src",
  ".",
]
testpaths = [
  "tests",
]

[tool.djlint]
profile = "django"
blank_line_after_tag = "load,extends,include,endblock"
indent = 2
extend_exclude = ".venv,.pytest_cache,.ruff_cache,build,dist,htmlcov"

[tool.ruff]
line-length = 88
src = [
  "src",
  "tests",
]
exclude = [
  ".venv",
]

[tool.ruff.lint]
extend-select = [
  "I",
  "T10",
  "DJ",
  "ERA",
  "C90",
  "S",
  "N",
]

[tool.ruff.lint.isort]
known-first-party = [
  "wagtail_show_hidden_characters",
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = [
  "S101",
]
"tests/conftest.py" = [
  "S101",
]

[project.urls]
Documentation = "https://github.com/allcaps/wagtail-show-hidden-characters/"
Changelog = "https://github.com/allcaps/wagtail-show-hidden-characters/blob/main/CHANGELOG.md"
Issues = "https://github.com/allcaps/wagtail-show-hidden-characters/issues"
Source = "https://github.com/allcaps/wagtail-show-hidden-characters"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
