{% extends "base.html" %}
{% load static wagtailcore_tags %}

{% block body_class %}template-homepage{% endblock %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'demo_app/css/home_page.css' %}">
{% endblock %}

{% block content %}
<main class="homepage-shell">
    <section class="text-resizer" data-text-resizer>
        <div class="text-resizer__content">
            {{ page.body|richtext }}
        </div>
        <div
            class="text-resizer__handle"
            role="separator"
            aria-label="Resize text container"
            aria-orientation="vertical"
            tabindex="0"
        ></div>
    </section>
</main>

{% endblock content %}

{% block extra_js %}
<script type="text/javascript" src="{% static 'demo_app/js/home_page.js' %}"></script>
{% endblock %}
